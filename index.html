<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Abschluss Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;700;800&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#0e402b; --forest-2:#16553a; --green:#298b5f; --green-soft:#dcefe3;
  --cream:#f5fada; --paper:#f3ede1; --paper-2:#faf6ee; --sand:#ebd893; --gold:#ddb049; --gold-2:#eaaf28;
  --ink:#00170d; --ink-2:#2c3d34; --muted:#66756c; --line:#e3dac6; --white:#fffdf8;
  --math:#8e3b3b; --math-t:#f6e6e3; --en:#f07a2a; --en-t:#fdebdc; --de:#2f5fc4; --de-t:#e3eaf9;
  --good:#298b5f; --warn:#c88a12; --bad:#d6452f;
  --r:16px; --shadow:0 1px 0 rgba(14,64,43,.06), 0 6px 18px -10px rgba(14,64,43,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;
  background-image:radial-gradient(circle at 12% 8%,rgba(221,176,73,.10),transparent 40%),radial-gradient(circle at 90% 60%,rgba(41,139,95,.08),transparent 45%);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Rubik,Nunito,sans-serif;margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:clamp(24px,4vw,32px);font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:17px;font-weight:700}
.brandfont{font-family:"Bagel Fat One",Rubik,sans-serif;font-weight:400;letter-spacing:.02em}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hidden{display:none!important}

/* Top bar */
.demo{background:var(--gold);color:var(--ink);font-size:14px;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.demo b{font-weight:800}
.demo button{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}
.demo button.on{background:var(--ink);color:var(--cream)}
.top{background:var(--forest);color:var(--cream);position:sticky;top:0;z-index:20}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--cream)}
.logo .wm{font-family:"Bagel Fat One",sans-serif;font-size:20px;line-height:.9;letter-spacing:.02em}
.logo .wm span{display:block;color:var(--green);color:#5fc493}
.logo .tag{background:var(--gold);color:var(--forest);font-family:"Bagel Fat One",sans-serif;font-size:13px;padding:3px 8px 2px;border-radius:8px;transform:rotate(-4deg)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:rgba(245,250,218,.75);padding:8px 14px;border-radius:999px;font-weight:700;white-space:nowrap;font-size:15px}
.tab:hover{color:var(--cream);background:rgba(255,255,255,.06)}
.tab.on{background:var(--cream);color:var(--forest)}
.me{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--green);color:var(--cream);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.rolebadge{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:rgba(245,250,218,.14)}
@media (max-width:760px){
  .top-in{flex-wrap:wrap;gap:8px}
  .tabs{order:3;width:100%}
  .me .nm{display:none}
}

/* Cards & UI */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;background:var(--green);color:var(--cream);display:inline-flex;align-items:center;gap:8px;transition:transform .08s,filter .15s;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.dark{background:var(--forest)}
.btn.gold{background:var(--gold);color:var(--forest)}
.btn.ghost{background:transparent;color:var(--forest);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--green)}
.btn.danger{background:transparent;color:var(--bad);border:2px solid #f0c9c1}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{border:2px solid var(--line);background:var(--white);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.on{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.chip.s-math.on{background:var(--math);border-color:var(--math)}
.chip.s-en.on{background:var(--en);border-color:var(--en);color:var(--ink)}
.chip.s-de.on{background:var(--de);border-color:var(--de)}
.pill{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--paper);color:var(--ink-2);white-space:nowrap}
.pill.new{background:var(--gold);color:var(--forest)}
.pill.done{background:var(--green-soft);color:var(--forest)}
.pill.late{background:#fbe0da;color:#9b2c1c}
.pill.draft{background:#e9e4d6;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:800;font-size:14px;color:var(--ink-2)}
.input,select.input,textarea.input{border:2px solid var(--line);background:var(--paper-2);border-radius:12px;padding:10px 12px;width:100%;outline:none}
.input:focus{border-color:var(--green);background:#fff}
textarea.input{min-height:70px;resize:vertical}
.section-title{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.section-title .count{color:var(--muted);font-weight:700}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty svg{margin-bottom:8px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:12px;font-weight:700;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw}
.toast.err{background:#7d2416}
.back{background:none;border:0;color:var(--forest);font-weight:800;padding:6px 0;margin-bottom:10px;display:inline-flex;gap:6px}

/* Subject quiz cards */
.qcard{text-align:left;border:0;padding:0;background:var(--white);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .12s, box-shadow .12s}
.qcard:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(14,64,43,.06),0 14px 26px -14px rgba(14,64,43,.4)}
.qband{padding:12px 16px 10px;color:var(--cream);display:flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.qband .subj{font-family:"Bagel Fat One",sans-serif;font-size:19px;letter-spacing:.03em}
.qband .blob{position:absolute;right:-14px;top:-16px;width:74px;height:74px;opacity:.22}
.s-math .qband{background:var(--math)}
.s-en .qband{background:var(--en);color:var(--ink)}
.s-de .qband{background:var(--de)}
.qbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.qbody h3{font-size:17px}
.qfoot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px;font-size:14px;color:var(--muted)}
.score{font-weight:800}
.sc-good{color:var(--good)} .sc-warn{color:var(--warn)} .sc-bad{color:var(--bad)}

/* Hello */
.hello{display:flex;align-items:center;gap:18px;background:var(--forest);color:var(--cream);border-radius:22px;padding:18px 22px;position:relative;overflow:hidden}
.hello h1{color:var(--cream)}
.hello .sub{color:rgba(245,250,218,.8);margin-top:4px}
.hello .stats{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap}
.hello .stat b{font-family:Rubik;font-size:22px;display:block;color:var(--gold)}
.hello .stat span{font-size:13px;color:rgba(245,250,218,.75)}
.hello .masc{flex:none;width:110px}
@media (max-width:560px){.hello .masc{width:76px}}

/* Play */
.play{max-width:720px;margin:0 auto}
.play-head{border-radius:20px 20px 0 0;padding:16px 20px;color:var(--cream);display:flex;align-items:center;gap:12px}
.play-head.s-en{color:var(--ink)}
.play-head .subj{font-family:"Bagel Fat One",sans-serif;font-size:20px}
.s-math.play-head{background:var(--math)} .s-en.play-head{background:var(--en)} .s-de.play-head{background:var(--de)}
.play-body{background:var(--white);border:1px solid var(--line);border-top:0;border-radius:0 0 20px 20px;padding:22px;box-shadow:var(--shadow)}
.progress{height:8px;background:var(--paper);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.qtext{font-size:20px;font-weight:800;font-family:Rubik;margin:4px 0 18px;line-height:1.35;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--paper-2);border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--green);background:#fff}
.opt .let{width:30px;height:30px;border-radius:9px;background:var(--white);border:2px solid var(--line);display:grid;place-items:center;font-weight:800;flex:none}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--green-soft)}
.opt.right .let{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fde7e2}
.opt.wrong .let{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.explain{margin-top:16px;border-radius:14px;padding:14px 16px;border-left:6px solid var(--good);background:var(--green-soft)}
.explain.bad{border-left-color:var(--bad);background:#fdeee9}
.explain .verdict{font-weight:800;font-family:Rubik;font-size:17px;margin-bottom:4px}
.explain p{margin:0;white-space:pre-wrap}
.play-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.result-hero{text-align:center;padding:10px 0 4px}
.result-hero .big{font-family:Rubik;font-weight:800;font-size:56px;line-height:1}
.review{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.review details{border:1px solid var(--line);border-radius:12px;background:var(--paper-2);padding:10px 14px}
.review summary{cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:flex-start;list-style:none}
.review summary::-webkit-details-marker{display:none}
.review .mk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;margin-top:1px}
.mk.ok{background:var(--good)} .mk.no{background:var(--bad)}
.review .ans{margin:8px 0 0 32px;font-size:15px}

/* Progress */
.subjects3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.subjects3{grid-template-columns:1fr}}
.subjcard{border-radius:var(--r);padding:16px;color:var(--cream);position:relative;overflow:hidden;min-height:118px}
.subjcard.s-en{color:var(--ink)}
.subjcard.s-math{background:var(--math)} .subjcard.s-en{background:var(--en)} .subjcard.s-de{background:var(--de)}
.subjcard .subj{font-family:"Bagel Fat One",sans-serif;font-size:18px}
.subjcard .pct{font-family:Rubik;font-weight:800;font-size:36px;line-height:1.1;margin-top:6px}
.subjcard .meta{font-size:13px;opacity:.85}
.subjcard .blob{position:absolute;right:-18px;bottom:-22px;width:100px;opacity:.2}
.topics{display:flex;flex-direction:column;gap:12px}
.topic{display:grid;grid-template-columns:minmax(120px,240px) 1fr 108px;gap:12px;align-items:center}
@media (max-width:560px){.topic{grid-template-columns:1fr 92px}.topic .bar{grid-column:1/-1;order:3}}
.topic .tn{font-weight:700;display:flex;gap:8px;align-items:center;min-width:0}
.topic .tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdot{width:10px;height:10px;border-radius:3px;flex:none}
.bar{height:12px;background:var(--paper);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:4px 99px 99px 4px}
.lvl{font-size:13px;font-weight:800;display:flex;gap:6px;align-items:center;justify-content:flex-end;white-space:nowrap}
.weak{display:flex;flex-direction:column;gap:10px}
.weak .w{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#fdf1ee;border:1px solid #f4d2ca}
.weak .w b{font-family:Rubik}

/* Tables */
.tablewrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--white);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--paper-2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #efe8d8;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf5ea}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cellscore{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.minibar{width:46px;height:6px;background:var(--paper);border-radius:9px;overflow:hidden;display:inline-block}
.minibar i{display:block;height:100%}

/* Teacher list */
.qrow{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;border-left:8px solid var(--line)}
.qrow.s-math{border-left-color:var(--math)} .qrow.s-en{border-left-color:var(--en)} .qrow.s-de{border-left-color:var(--de)}
.qrow .info{flex:1;min-width:0}
.qrow .info h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qrow .kpis{display:flex;gap:18px;text-align:center}
.qrow .kpis b{display:block;font-family:Rubik;font-size:18px}
.qrow .kpis span{font-size:12px;color:var(--muted);font-weight:700}
.qrow .acts{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:760px){.qrow{flex-wrap:wrap}.qrow .kpis{width:100%;justify-content:flex-start}}
.subjtag{font-family:"Bagel Fat One",sans-serif;font-size:13px;padding:2px 8px 1px;border-radius:7px;color:#fff;letter-spacing:.03em}
.subjtag.s-math{background:var(--math)} .subjtag.s-en{background:var(--en);color:var(--ink)} .subjtag.s-de{background:var(--de)}

/* Editor */
.editor{max-width:820px;margin:0 auto}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--white);border-radius:12px;padding:9px 14px;font-weight:800;display:flex;gap:8px;align-items:center}
.seg button.on.s-math{background:var(--math);border-color:var(--math);color:#fff}
.seg button.on.s-en{background:var(--en);border-color:var(--en)}
.seg button.on.s-de{background:var(--de);border-color:var(--de);color:#fff}
.seg button.on.plain{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.qedit{border:1px solid var(--line);border-radius:var(--r);background:var(--white);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.qedit .qh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qedit .qnum{font-family:Rubik;font-weight:800;background:var(--forest);color:var(--cream);border-radius:9px;padding:2px 10px}
.iconbtn{border:0;background:var(--paper);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-weight:800}
.iconbtn:hover{background:#ebe2cf}
.optedit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.optedit input[type=radio]{width:22px;height:22px;accent-color:var(--green);flex:none}
.optedit .input{padding:8px 10px}
.optedit.isright .input{border-color:var(--good);background:#f0f9f3}
.hint{font-size:13px;color:var(--muted)}
.sticky-actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--paper) 30%);padding:18px 0 10px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.errbox{background:#fdeee9;border:1px solid #f4d2ca;color:#7d2416;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700}

/* Admin */
.kpis6{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-family:Rubik;font-weight:800;font-size:30px;line-height:1.1;color:var(--forest)}
.kpi .l{font-size:13px;color:var(--muted);font-weight:700}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.days{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:10px}
.days .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;position:relative}
.days .d i{width:100%;max-width:26px;background:var(--green);border-radius:4px 4px 0 0;min-height:2px}
.days .d:hover i{background:var(--forest)}
.days .d span{font-size:10px;color:var(--muted);font-weight:700}
.days .d .tip{position:absolute;bottom:calc(100% - 6px);background:var(--ink);color:var(--cream);font-size:12px;padding:4px 8px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s}
.days .d:hover .tip{opacity:1}
.feed{display:flex;flex-direction:column}
.feed .ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #efe8d8;align-items:flex-start}
.feed .ev:last-child{border-bottom:0}
.feed .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:16px;background:var(--paper)}
.feed .t{font-size:13px;color:var(--muted)}
.req{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #efe8d8;flex-wrap:wrap}
.gchip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:5px 6px 5px 12px;font-weight:800}
.gchip button{border:0;background:#e6dcc6;border-radius:50%;width:22px;height:22px;line-height:1;font-weight:800}
.note{background:#fff8e2;border:1px solid #f0dfa6;border-radius:14px;padding:14px 16px;font-size:15px}
.note ol{margin:6px 0 0;padding-left:20px}

/* Onboarding */
.onb{max-width:520px;margin:40px auto;text-align:center}
.onb .card{text-align:left;margin-top:18px}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolepick button{border:2px solid var(--line);background:var(--paper-2);border-radius:14px;padding:14px;font-weight:800;text-align:left}
.rolepick button small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.rolepick button.on{border-color:var(--green);background:var(--green-soft)}
.loading{display:grid;place-items:center;min-height:70vh;text-align:center;color:var(--muted)}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.wide{width:100%;justify-content:center}
.linkbtn{background:none;border:0;color:var(--forest);padding:4px 0;font-size:14px}
.linkbtn:hover{text-decoration:underline}
.authlinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.mono,.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.code{background:var(--paper);border:1px dashed #d6c9ab;border-radius:9px;padding:6px 10px;font-weight:700;font-size:15px}
.coderow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #efe8d8;flex-wrap:wrap}
.aibox{background:linear-gradient(135deg,#fff8e2,#f3f8ec);border:2px solid #ead79d;border-radius:var(--r);padding:16px;margin:22px 0 4px}

function myRole(){ if(S.me.isOwner) return 'admin'; return roleOf(S.me.id); }
const isStaff = () => ['admin','teacher'].includes(myRole());
const groupOf = id => S.roles[id]?.group || prof(id)?.group || '';
const groups = () => (S.config.groups||[]);
const students = () => Object.keys(S.profiles).filter(id => roleOf(id)==='student');
const att = (uid, qid) => S.attempts[uid]?.byQuiz?.[qid];
function isAssigned(q, uid){
  if(!q.published) return false; const t = q.targets || {all:true};
  return !!(t.all || (t.groups||[]).includes(groupOf(uid)) || (t.students||[]).includes(uid));
}
const assignedTo = q => students().filter(uid => isAssigned(q, uid));
const quizList = () => Object.entries(S.quizzes).map(([id,q]) => ({id, ...q})).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
function targetText(q){ const t=q.targets||{all:true}; if(t.all) return 'Все ученики';
  const parts=[]; if(t.groups?.length) parts.push('Группы: '+t.groups.join(', ')); if(t.students?.length) parts.push(t.students.length+' '+plural(t.students.length,'ученик','ученика','учеников'));
  return parts.join(' · ') || 'Никому не назначен'; }
function quizStats(q){
  const as = assignedTo(q); const done = as.filter(u => att(u,q.id));
  return {assigned:as.length, done:done.length, avg: avg(done.map(u=>att(u,q.id).score))};
}
function studentStats(uid){
  const qs = quizList().filter(q => isAssigned(q, uid));
  const done = qs.filter(q => att(uid,q.id));
  const bySubj = {}; SUBJ_KEYS.forEach(k => { const d = done.filter(q=>q.subject===k);
    const c = d.reduce((s,q)=>s+att(uid,q.id).correct,0), t = d.reduce((s,q)=>s+att(uid,q.id).total,0);
    bySubj[k] = {done:d.length, assigned:qs.filter(q=>q.subject===k).length, pct: t? Math.round(c/t*100) : null}; });
  const topics = {};
  done.forEach(q => { const a = att(uid,q.id); const key = q.subject+'|'+(q.topic||'Без темы');
    (topics[key] ||= {subject:q.subject, topic:q.topic||'Без темы', c:0, t:0, quizzes:[]});
    topics[key].c += a.correct; topics[key].t += a.total; topics[key].quizzes.push(q.id); });
  const topicArr = Object.values(topics).map(x => ({...x, pct: Math.round(x.c/x.t*100)}));
  const last = done.map(q => att(uid,q.id).finishedAt).sort().pop();
  const all = done.reduce((s,q)=>s+att(uid,q.id).correct,0), allT = done.reduce((s,q)=>s+att(uid,q.id).total,0);
  return {qs, done, bySubj, topics:topicArr, last, pct: allT ? Math.round(all/allT*100) : null};
}

let renderQueued = false; let pointerIsDown = false;

function render(){
  if(S.mode==='loading') return;

  if(S._keepScroll) window.scrollTo(0, sy); S._keepScroll = false;

}
function softRender(){ // from snapshots: avoid clobbering forms
  if(S.sub && ['edit','play'].includes(S.sub.name)) return;

}
document.addEventListener('focusout', () => setTimeout(()=>{ if(pointerIsDown) return; if(renderQueued && !(document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))){ renderQueued=false; softRender(); } }, 400));

function trAuth(m){ m = String(m||'');

  if(/already registered|already been registered/i.test(m)) return 'Этот e-mail уже зарегистрирован. Попробуй войти.';
  if(/Password should|weak/i.test(m)) return 'Пароль слишком простой: минимум 8 символов, лучше с цифрами.';
  if(/rate limit|too many|security purposes/i.test(m)) return 'Слишком много попыток подряд. Подожди пару минут и попробуй снова.';
  if(/school code|Database error saving new user/i.test(m)) return 'Код школы не подошёл. Проверь его у преподавателя.';

/* ---------- Intro / Play ---------- */
function introView(qid){
  const q = S.quizzes[qid]; if(!q) return backBtn()+`<div class="card empty">Квиз не найден или удалён.</div>`;
  const a = att(S.me.id, qid);
  return `${backBtn()}<div class="play"><div class="play-head s-${q.subject}"><span class="subj">${SUBJ[q.subject].de}</span><span class="spacer"></span><span>${esc(q.topic||'')}</span></div>
    <div class="play-body" style="text-align:center">
      ${mascot(SUBJ[q.subject].color,110)}
      <h1 style="margin-top:6px">${esc(q.title)}</h1>
      ${q.description?`<p class="muted">${esc(q.description)}</p>`:''}
      <p><b>${q.questions.length}</b> ${plural(q.questions.length,'вопрос','вопроса','вопросов')}${q.due?` · сдать до <b>${fmtDate(q.due)}</b>`:''}</p>
      <p class="muted small">После каждого ответа сразу увидишь, правильно ли, и объяснение.</p>
      ${a ? `<div class="card" style="margin:16px auto;max-width:360px;text-align:left"><div class="row"><span>Твой результат</span><span class="spacer"></span><b class="${scCls(a.score)}" style="font-size:22px">${a.score}%</b></div>
        <div class="muted small">Попыток: ${a.tries||1} · лучший: ${a.best??a.score}% · ${fmtWhen(a.finishedAt)}</div></div>`:''}
      <div class="row" style="justify-content:center;margin-top:10px">
        ${a ? `<button class="btn ghost" data-a="review" data-id="${qid}">Посмотреть ответы</button>`:''}
        <button class="btn" data-a="startQuiz" data-id="${qid}">${a?'Пройти ещё раз':'Начать квиз'} →</button>
      </div>
    </div></div>`;
}
function playView(){
  const P = S.play, q = P.quiz;
  if(P.finished) return resultScreen();
  const item = q.questions[P.i]; const n = q.questions.length;
  const L = 'ABCDEF';
  const opts = item.options.map((o,j)=>{
    let cls = ''; if(P.revealed){ if(j===item.correct) cls='right'; else if(j===P.picked) cls='wrong'; else cls='dim'; }
    return `<button class="opt ${cls}" data-a="pick" data-j="${j}" ${P.revealed?'disabled':''}><span class="let">${P.revealed&&j===item.correct?'✓':P.revealed&&j===P.picked?'✗':L[j]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  const ok = P.picked===item.correct;
  const exp = P.revealed ? `<div class="explain ${ok?'':'bad'}" role="status"><div class="verdict">${ok ? pick(['Верно! 🎉','Точно! 💪','Да, так и есть ✓','Отлично!']) : `Неверно. Правильный ответ: ${L[item.correct]}`}</div>
     ${item.explanation ? `<p>${esc(item.explanation)}</p>` : `<p class="muted">Объяснение не добавлено.</p>`}</div>` : '';
  return `<div class="play"><div class="play-head s-${q.subject}"><span class="subj">${SUBJ[q.subject].de}</span><span class="small" style="opacity:.85">${esc(q.title)}</span><span class="spacer"></span><b>${P.i+1}/${n}</b></div>
    <div class="play-body">
      <div class="progress"><i style="width:${(P.i + (P.revealed?1:0))/n*100}%"></i></div>
      <div class="qtext">${esc(item.q)}</div>
      <div class="opts">${opts}</div>${exp}
      <div class="play-nav"><button class="btn ghost sm" data-a="quitPlay">Выйти</button>
      ${P.revealed ? `<button class="btn" data-a="next" id="nextbtn">${P.i+1<n?'Дальше →':'Завершить ✓'}</button>`:`<span class="muted small">Выбери ответ</span>`}</div>
    </div></div>`;
}
const pick = arr => arr[(S.play?.i||0) % arr.length];
function resultScreen(){
  const P = S.play, q = P.quiz; const r = P.result;
  const mood = r.score>=80?'happy':r.score>=60?'cool':'sad';
  const msg = r.score===100?'Идеально! Все ответы верные 🔥':r.score>=80?'Супер результат!':r.score>=60?'Неплохо! Посмотри ошибки ниже.':'Есть над чем поработать - разбери объяснения и попробуй ещё раз.';
  return `<div class="play"><div class="play-head s-${q.subject}"><span class="subj">${SUBJ[q.subject].de}</span><span class="small">${esc(q.title)}</span></div>
    <div class="play-body"><div class="result-hero">${mascot(SUBJ[q.subject].color,110,mood)}
      <div class="big ${scCls(r.score)}">${r.score}%</div><p><b>${r.correct} из ${r.total}</b> правильно · ${msg}</p>
      ${P.saving?'<p class="muted small">Сохраняем…</p>':P.saveFailed?'<p class="small sc-bad">Результат не сохранился.</p>':''}
      <div class="row" style="justify-content:center"><button class="btn ghost" data-a="tab" data-tab="home">К квизам</button><button class="btn" data-a="startQuiz" data-id="${q.id}">Ещё раз</button></div></div>
      <h3 style="margin-top:22px">Разбор</h3>${reviewList(q, r.answers)}</div></div>`;
}
function reviewList(q, answers){
  const L='ABCDEF';
  return `<div class="review">${q.questions.map((it,i)=>{ const a = answers?.[i]; const ok = a===it.correct;
    return `<details ${ok?'':'open'}><summary><span class="mk ${ok?'ok':'no'}">${ok?'✓':'✗'}</span><span>${i+1}. ${esc(it.q)}</span></summary>
      <div class="ans">${a==null?'<span class="muted">Нет ответа</span>':ok?`Ответ: <b>${esc(it.options[a])}</b>`:`Ответ: <s>${esc(it.options[a]??'?')}</s> → правильно: <b>${L[it.correct]}) ${esc(it.options[it.correct])}</b>`}
      ${it.explanation?`<div class="muted" style="margin-top:6px;white-space:pre-wrap">${esc(it.explanation)}</div>`:''}</div></details>`; }).join('')}</div>`;
}
const backBtn = (label='← Назад') => `<button class="back" data-a="back">${label}</button>`;

    <div class="section-title"><h2>По темам</h2></div>

      <div class="bar" title="${t.c} из ${t.t} верно"><i style="width:${Math.max(t.pct,3)}%;background:${scColor(t.pct)}"></i></div><div class="lvl" style="color:${scColor(t.pct)}">${t.pct}% · ${lvlLabel(t.pct).split(' ')[1]}</div></div>`).join('')}</div></div>`

      ${hist.map(q=>{ const a=att(uid,q.id); return `<tr class="click" data-a="${self?'openQuiz':'reviewOf'}" data-id="${q.id}" data-uid="${uid}"><td><span class="subjtag s-${q.subject}">${SUBJ[q.subject].de.slice(0,4)}</span> ${esc(q.title)}</td><td class="muted">${esc(q.topic||'')}</td><td class="num"><b class="${scCls(a.score)}">${a.score}%</b></td><td class="num">${a.tries||1}</td><td class="muted">${fmtWhen(a.finishedAt)}</td></tr>`; }).join('')}
    </tbody></table></div>`:''}`;

function resultsView(qid){
  const q = S.quizzes[qid] && {id:qid, ...S.quizzes[qid]}; if(!q) return backBtn()+`<div class="card empty">Квиз удалён.</div>`;
  const as = assignedTo(q); const st = quizStats(q);
  const rows = as.map(u=>({u, a:att(u,qid)})).sort((x,y)=>(y.a?.score??-1)-(x.a?.score??-1));
  const doneRows = rows.filter(r=>r.a);
  const perQ = q.questions.map((it,i)=>{ const answered = doneRows.filter(r=>r.a.answers && r.a.answers[i]!=null);
    const right = answered.filter(r=>r.a.answers[i]===it.correct).length;
    const wrongCounts = {}; answered.forEach(r=>{ const v=r.a.answers[i]; if(v!==it.correct) wrongCounts[v]=(wrongCounts[v]||0)+1; });
    const topWrong = Object.entries(wrongCounts).sort((a,b)=>b[1]-a[1])[0];
    return {i, it, n:answered.length, pct: answered.length? Math.round(right/answered.length*100):null, topWrong}; });
  return `${backBtn()}<div class="row"><span class="subjtag s-${q.subject}" style="font-size:16px">${SUBJ[q.subject].de}</span><h1>${esc(q.title)}</h1></div>
    <p class="muted">${esc(q.topic||'')} · ${esc(targetText(q))}${q.due?` · до ${fmtDate(q.due)}`:''}</p>
    <div class="kpis6"><div class="kpi"><div class="v">${st.done}/${st.assigned}</div><div class="l">прошли квиз</div></div>
      <div class="kpi"><div class="v ${scCls(st.avg)}">${st.avg==null?'-':st.avg+'%'}</div><div class="l">средний балл</div></div>
      <div class="kpi"><div class="v">${st.assigned-st.done}</div><div class="l">ещё не прошли</div></div>
      <div class="kpi"><div class="v">${doneRows.filter(r=>r.a.score<60).length}</div><div class="l">ниже 60%</div></div></div>
    <div class="section-title"><h2>Ученики</h2></div>
    ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>Ученик</th><th>Группа</th><th>Статус</th><th class="num">Результат</th><th class="num">Лучший</th><th class="num">Попыток</th><th>Когда</th></tr></thead><tbody>
      ${rows.map(({u,a})=>`<tr class="click" data-a="openStudent" data-uid="${u}"><td><b>${esc(nameOf(u))}</b></td><td class="muted">${esc(groupOf(u)||'-')}</td>
        <td>${a?'<span class="pill done">Пройден</span>':(q.due&&q.due<today()?'<span class="pill late">Просрочен</span>':'<span class="pill">Не начат</span>')}</td>
        <td class="num">${a?`<span class="cellscore ${scCls(a.score)}">${a.score}%</span>`:'-'}</td><td class="num">${a?(a.best??a.score)+'%':'-'}</td><td class="num">${a?(a.tries||1):'-'}</td><td class="muted">${a?fmtWhen(a.finishedAt):''}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="card empty">Квиз никому не назначен${q.published?'':' (черновик)'}.</div>`}
    <div class="section-title"><h2>Вопросы: где ошибаются</h2></div>
    <div class="card"><div class="topics">${perQ.map(p=>`<div class="topic"><div class="tn" title="${esc(p.it.q)}"><b>${p.i+1}.</b><span>${esc(p.it.q)}</span></div>
      <div class="bar">${p.pct==null?'':`<i style="width:${Math.max(p.pct,3)}%;background:${scColor(p.pct)}"></i>`}</div>
      <div class="lvl" style="color:${p.pct==null?'var(--muted)':scColor(p.pct)}">${p.pct==null?'нет данных':p.pct+'% верно'}</div></div>
      ${p.topWrong && p.pct<80 ? `<div class="small muted" style="margin:-6px 0 4px 0">Частая ошибка: «${esc(p.it.options[p.topWrong[0]]??'?')}» (${p.topWrong[1]})</div>`:''}`).join('')}</div></div>`;
}

async function finishQuiz(){
  const P = S.play, q = P.quiz; const n = q.questions.length;
  const answers = Array.from({length:n}, (_,i) => P.answers[i] ?? null);
  const flags = q.questions.map((it,i)=>answers[i]===it.correct); const correct = flags.filter(Boolean).length;
  P.finished = true; P.result = {answers, flags, correct, total:n, score:Math.round(correct/n*100)}; P.saving = true; render(); window.scrollTo(0,0);
  try{ const rec = await api.submit(q.id, answers, P.startedAt); P.result = rec; P.saving = false; }
  catch(e){ P.saving = false; P.saveFailed = true; writeErr(e); }
  if(S.sub?.name==='play') { S._keepScroll=true; render(); }
}
async function saveQuiz(publish){
  const E = S.editor; const errs = [];
  if(!E.title.trim()) errs.push('Добавьте название.');
  E.questions.forEach((it,i)=>{ const n=i+1;
    if(!it.q.trim()) errs.push(`Вопрос ${n}: нет текста.`);
    const filled = it.options.filter(o=>o.trim()).length; if(filled<2) errs.push(`Вопрос ${n}: нужно минимум 2 варианта.`);
    if(!(it.options[it.correct]||'').trim()) errs.push(`Вопрос ${n}: правильный вариант пустой.`); });
  if(publish && !E.targets.all && !E.targets.groups.length && !E.targets.students.length) errs.push('Выберите, кому назначить квиз.');
  E.errors = errs; if(errs.length){ render(); window.scrollTo(0,0); return; }
  // drop empty options, keep correct index aligned
  const questions = E.questions.map(it => { const keep = it.options.map((o,j)=>({o:o.trim(),j})).filter(x=>x.o);
    return {q:it.q.trim(), options:keep.map(x=>x.o), correct: keep.findIndex(x=>x.j===it.correct), explanation:(it.explanation||'').trim()}; });
  const now = new Date().toISOString(); const old = E.id ? S.quizzes[E.id] : null;
  const doc = {title:E.title.trim(), subject:E.subject, topic:(E.topic||'').trim(), description:(E.description||'').trim(), due:E.due||'',
    targets:{all:!!E.targets.all, groups:E.targets.groups, students:E.targets.students}, questions, published: !!publish || (publish===false && false),
    authorId: old?.authorId || S.me.id, createdAt: old?.createdAt || now, updatedAt: now};
  doc.published = !!publish;
  try{ await api.saveQuiz(E.id, doc); toast(publish ? 'Квиз опубликован ✓' : 'Черновик сохранён'); S.editor = null; S.sub = null; S.prevSub = null; S.tab='teach'; render(); window.scrollTo(0,0); }
  catch(e){ writeErr(e); }
}

async function authSubmit(mode){
  const f = S.authForm; const email = (f.email||'').trim(), pw = f.password||'';
  S.authErr = ''; S.authOk = '';
  const fail = msg => { S.busy = false; S.authErr = msg; render(); };
  if(mode!=='reset' && !/^\S+@\S+\.\S+$/.test(email)) return fail('Проверь, правильно ли написан e-mail.');
  S.busy = true; render();
  try{
    if(mode==='login'){
      if(!pw) return fail('Введи пароль.');
      const { data, error } = await sb.auth.signInWithPassword({email, password:pw});
      if(error) return fail(trAuth(error.message));
      S.busy = false; f.password = ''; await onSignedIn(data.session); return;
    }
    if(mode==='signup'){
      const name = (f.name||'').trim(); const code = (f.code||'').trim().toUpperCase();
      if(name.length < 2) return fail('Напиши имя и фамилию.');
      if(pw.length < 8) return fail('Пароль - минимум 8 символов.');
      const chk = await sb.rpc('check_code', {p_code:code});
      if(!chk.data) { S.codeStatus = 'bad'; return fail('Код школы не подошёл. Проверь его у преподавателя.'); }
      const { data, error } = await sb.auth.signUp({email, password:pw, options:{data:{name, code}, emailRedirectTo: location.origin + location.pathname}});
      if(error) return fail(trAuth(error.message));
      if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0) return fail('Этот e-mail уже зарегистрирован. Попробуй войти.');
      S.busy = false; f.password = '';
      if(data.session){ await onSignedIn(data.session); return; }
      S.authMode = 'login'; S.authOk = `Почти готово! Мы отправили письмо на ${email}. Открой его и нажми ссылку, потом войди здесь.`; render(); return;
    }
    if(mode==='forgot'){
      const { error } = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
      if(error) return fail(trAuth(error.message));
      S.busy = false; S.authMode = 'login'; S.authOk = `Если такой аккаунт есть, письмо со ссылкой уже летит на ${email}.`; render(); return;
    }
    if(mode==='reset'){
      if(pw.length < 8) return fail('Пароль - минимум 8 символов.');
      const { error } = await sb.auth.updateUser({password:pw});
      if(error) return fail(trAuth(error.message));
      S.busy = false; S.recovery = false; f.password = ''; toast('Пароль сохранён ✓');
      const { data } = await sb.auth.getSession(); if(data.session) await onSignedIn(data.session); else { S.authMode='login'; render(); } return;
    }
  }catch(e){ console.warn(e); fail(trAuth(e?.message||'network')); }
}
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if(d.ng){ S.newGroup = t.value; return; }
  if(d.af){ S.authForm[d.af] = t.value; if(d.af==='code') S.codeStatus=null; return; }
  const E = S.editor; if(!E) return;
  if(d.ed){ E[d.ed] = t.value; E.dirty=true; }
  else if(d.eq!=null && d.f){ E.questions[+d.eq][d.f] = t.value; E.dirty=true; }
  else if(d.eo!=null){ E.questions[+d.eo].options[+d.j] = t.value; E.dirty=true; }
});
document.addEventListener('change', async e => {
  const t = e.target, d = t.dataset;
  if(d.af==='code' && t.value.trim().length>=4 && sb){ try{ const r = await sb.rpc('check_code',{p_code:t.value}); S.codeStatus = r.data || 'bad'; S._keepScroll=true; render(); }catch(e){} return; }
  if(d.ec!=null && S.editor){ S.editor.questions[+d.ec].correct = +d.j; S.editor.dirty=true; S._keepScroll=true; render(); return; }
  if(d.role){ try{ await api.setRole(d.role, t.value); toast('Роль обновлена'); }catch(err){ writeErr(err); } t.blur(); render(); }
  if(d.group!=null && d.group!==''){ try{ await api.setGroup(d.group, t.value); toast('Группа обновлена'); }catch(err){ writeErr(err); } t.blur(); render(); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target?.dataset?.ng){ e.preventDefault(); A.addGroup(); return; }
  if(S.sub?.name!=='play' || !S.play || S.play.finished) return;
  if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) return;
  const P = S.play; const k = e.key.toUpperCase();
  if(!P.revealed){ const j = 'ABCDEF'.indexOf(k); const j2 = '123456'.indexOf(e.key); const idx = j>=0?j:j2; if(idx>=0 && idx<P.quiz.questions[P.i].options.length){ A.pick({dataset:{j:idx}}); e.preventDefault(); } }
  else if(e.key==='Enter'){ A.next(); e.preventDefault(); }
});

/* ===================== Boot ===================== */
function initTab(){ const h = (location.hash||'').slice(1); if(h && /^[a-z]+$/.test(h)) S.tab = h; }
function showLoading(text='Загружаем…'){ $app.innerHTML = `<div class="loading"><div><div class="bob">${mascot('#ddb049',120)}</div><p>${text}</p></div></div>`; }
async function onSignedIn(session){
  S.me = {id:session.user.id, email:session.user.email, isOwner:false};
  S.mode = 'loading'; showLoading();
  try{ await api.load(); }catch(e){ console.warn(e); S.loadError = true; }
  S.mode = 'live'; S.tab = null; S.sub = null; initTab(); render();
}
async function refresh(){
  if(S.mode!=='live' || S.isDemo) return;
  if(S.sub && ['edit','play'].includes(S.sub.name)) return;
  try{ await api.load(); softRender(); }catch(e){ console.warn('refresh', e); }
}
async function boot(){
  document.getElementById('bootmasc').innerHTML = mascot('#ddb049',120);
  const params = new URLSearchParams(location.search);
  if(params.has('demo') || !window.supabase){
    api = demoApi; S.isDemo = true;
    const store = {profiles:{}, roles:{}, quizzes:{}, attempts:{}, config:{}}; seedDemo(store);
    S.profiles = store.profiles; S.roles = store.roles; S.quizzes = store.quizzes; S.attempts = store.attempts;
    S.groupObjs = store.config.school.groups.map(n=>({id:n, name:n, code:mkCode(n)})); S.config = {groups:S.groupObjs.map(g=>g.name)};
    S.settings = {teacher_code:'T-'+mkCode('')};
    S.me = {id: params.get('as') || 'u-anya', isOwner:false};
    S.mode = 'live'; initTab(); render(); return;
  }
  api = sbApi;
  S.recovery = /type=recovery/.test(location.hash);
  sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'implicit'}});
  sb.auth.onAuthStateChange((ev) => {
    if(ev==='PASSWORD_RECOVERY'){ S.recovery = true; S.mode = 'auth'; S.authMode = 'reset'; S.authErr = S.authOk = ''; render(); }
  });
  let session = null;
  try{ session = (await sb.auth.getSession()).data.session; }catch(e){ console.warn(e); }
  if(/access_token|type=/.test(location.hash)) try{ history.replaceState(null,'',location.pathname); }catch(e){}
  if(S.recovery){ S.mode = 'auth'; S.authMode = 'reset'; render(); return; }
  if(session) await onSignedIn(session); else { S.mode = 'auth'; render(); }
  setInterval(refresh, 60000);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && Date.now()-(S.loadedAt||0) > 20000) refresh(); });
}
window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if(S.mode==='live' && h && h!==S.tab && tabsFor(myRole()).some(t=>t[0]===h)) go(h); });
boot();
</script>
